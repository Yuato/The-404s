<!doctype html>

<html>
  <body>
    <div style="position: relative">
      <img
        style="position: absolute; top: 50px; left: 50px"
        src="images/teapot.png"
        alt="Teapot Logo"
        id="teapot"
      />
      <canvas
        id="myCanvas"
        style="position: absolute; top: 50px; left: 50px"
        width="500"
        height="500"
      >
      </canvas>
    </div>

    <script>
      class gear {
        constructor(centerX, centerY, numberOfTeeth, toothWidth, toothHeight) {
          this.centerX = centerX;
          this.centerY = centerY;
          this.numberOfTeeth = numberOfTeeth;
          this.toothWidth = toothWidth;
          this.toothHeight = toothHeight;
        }

        draw(ctx) {
          const radius = 25;

          ctx.beginPath();
          for (let i = 0; i < this.numberOfTeeth; i++) {
            const angle = (i / this.numberOfTeeth) * 2 * Math.PI;
            const x = this.centerX + radius * Math.cos(angle);
            const y = this.centerY + radius * Math.sin(angle);
            ctx.lineTo(x, y);
            ctx.lineTo(
              x + this.toothWidth * Math.cos(angle),
              y + this.toothWidth * Math.sin(angle),
            );
          }
          ctx.closePath();
          ctx.arc(this.centerX, this.centerY, radius / 1.25, 0, 2 * Math.PI);
          ctx.strokeStyle = "black";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
      const myCanvas = document.getElementById("myCanvas");
      const ctx = myCanvas.getContext("2d");
      const leftGear = new gear(
        myCanvas.width / 2 - 35,
        myCanvas.height / 2 - 80,
        10,
        10,
        40,
      );
      leftGear.draw(ctx);

      const rightGear = new gear(
        myCanvas.width / 2 - 110,
        myCanvas.height / 2 - 80,
        10,
        10,
        40,
      );
      rightGear.draw(ctx);
    </script>
  </body>
</html>
