<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Professional Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="profile-container">
        <!-- Header Section -->
        <header class="profile-header">
            <div class="banner"></div>
            <div class="header-content">
                <img src="placeholder.jpg" alt="Profile Picture" class="pfp">
                <div class="user-info">
                    <h1>User</h1>
                    <p class="headline">Current Position</p>
                    <p class="location">Location</p>
                </div>
            </div>
        </header>

        <!-- About Section -->
        <section class="profile-card">
            <h3>About</h3>
            <p>Short Description</p>
        </section>

        
        <section class="profile-card">
            <h3>Education & Projects</h3>
            <div class="item">
                <strong>Title</strong>
                <p>Time Frame</p>
            </div>
            <div class="item">
                <strong>Title</strong>
                <p>Short Description</p>
            </div>
        </section>

        <!-- Skills Section -->
        <section class="profile-card">
            <h3>Skills</h3>
            <div class="skills-list">
                <span>Skill 1</span>
                <span>Skill 2</span>
                <span>Skill 3</span>
                <span>Skill 4</span>
            </div>
        </section>
    </div>
</body>
</html>
